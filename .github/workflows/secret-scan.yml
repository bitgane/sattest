name: Secret scan

on:
  push:
    branches: [master, main]
  pull_request:

# Scans git history for committed secrets. The security audit (F-05) found that
# live credentials had once been committed, so this guards against a repeat.
# Optional — delete this file to remove the check.
#
# gitleaks-action is free for individual accounts and public repositories. Repos
# under a GitHub *Organization* need a free GITLEAKS_LICENSE (see the action's
# README); add it as a repository secret if this ever runs under an org.
jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
